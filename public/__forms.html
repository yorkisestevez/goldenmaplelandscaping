<!doctype html>
<!--
  Netlify Forms detection file. Netlify's build bot scans deployed HTML for forms
  with the `netlify` attribute and registers their schemas. In framework mode the
  app no longer ships a static index.html, so these hidden form definitions live
  here (any HTML file in the publish dir is scanned). Attribution fields (utm_*,
  gclid, fbclid, etc.) are populated at runtime by src/utils/utmCapture.ts and
  forwarded to the CRM via the submission-created bridge function.

  IMPORTANT: this file must be the ONLY schema source for the forms below
  (contact, quick-quote, cost-estimator, cost-guide, guide-download,
  estimate-request). Do NOT put data-netlify
  on the runtime JSX versions of these forms — the prerendered pages get
  scanned too, and their slim static markup (attribution inputs are added by
  JS at runtime, so they're absent from prerendered HTML) re-registers the
  form WITHOUT gclid/utm fields. Netlify then silently drops those fields
  from every submission. That exact regression broke ad attribution until
  2026-07-02. Runtime forms submit fine without the attribute: the fetch
  POST carries `form-name`, which routes to the schema registered here.
-->
<html lang="en">
  <head><meta charset="UTF-8" /><title>Netlify form definitions</title></head>
  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="details"></textarea>
      <!-- Contact.tsx and HeroContactForm.tsx both POST these under form-name
           "contact" (lead_score/lead_tier/lead_score_reasons come from
           scoreGoldenMapleLead; event_id from genEventId for Meta CAPI dedup)
           but they were never declared here, so Netlify silently dropped
           them — the primary contact form's lead scoring never reached the
           CRM. Declared 2026-08-14, alongside the same fields already on
           cost-estimator. -->
      <input type="text" name="event_id" />
      <input type="text" name="conversion_event_id" />
      <input type="text" name="lead_score" />
      <input type="text" name="lead_tier" />
      <input type="text" name="lead_score_reasons" />
      <input type="text" name="utm_source" />
      <input type="text" name="utm_medium" />
      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_content" />
      <input type="text" name="utm_term" />
      <input type="text" name="gclid" />
      <input type="text" name="fbclid" />
      <input type="text" name="campaign_id" />
      <input type="text" name="variant_id" />
      <input type="text" name="touch_id" />
      <input type="text" name="latest_campaign_id" />
      <input type="text" name="latest_variant_id" />
      <input type="text" name="latest_touch_id" />
      <input type="text" name="landing_page" />
      <input type="text" name="referrer" />
      <input type="text" name="visitor_id" />
      <input type="text" name="ga4_client_id" />
      <input type="text" name="clarity_recording_url" />
      <input type="text" name="visit_count" />
      <input type="text" name="first_visit_at" />
      <input type="text" name="session_duration_sec" />
      <textarea name="behavior_json"></textarea>
    </form>
