name: Weekly Blog Publisher

# RETIRED — disabled at the repo level (Actions → Weekly Blog Publisher →
# Disabled). Publishing now runs via a scheduled Claude Code routine calling
# the local `claude` CLI, NOT this workflow. See scripts/blog-publisher/README.md
# "Generation model" for the current setup. Left in the repo for history —
# do not re-enable without first fixing the dead GEMINI_API_KEY secret this
# workflow still passes in below (generate.cjs's real generation path today
# is the local Claude CLI via claude-provider.cjs, not Gemini).
#
# Original description (no longer accurate — kept for context):
# Runs every Monday at 13:00 UTC = 9:00 AM EDT (8:00 AM EST in winter).
# Picks the next unused topic from scripts/blog-publisher/topics.json, asks Gemini 2.5 Pro
# for a 1500-2200 word post, injects it into the site, opens a PR, and Telegrams Yorkis.
# Computer can be off — this all runs on GitHub's runners.

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Force a specific topic id (e.g. auto-005). Leave blank for next-in-queue.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-publisher
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run blog publisher (generate → inject → branch → PR → Telegram)
        id: publisher
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          FORCE_TOPIC_ID:      ${{ inputs.topic_id }}
        run: node scripts/blog-publisher/cli.cjs workflow-run

      # Backstop alert — fires on ANY job failure regardless of where it happened.
      # Catches failures the Node script's inner try/catch couldn't reach (e.g. early
      # crashes, OS errors, gh CLI permission issues like the 2026-05-25 incident).
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          MSG="🚨 Weekly Blog Publisher FAILED
          Trigger: ${{ github.event_name }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Open the run logs and look for the red step. Common causes:
          - This workflow is RETIRED and disabled — this alert firing at all means
            someone re-enabled it. Publishing normally runs elsewhere (see README).
          - Topic queue empty (refill scripts/blog-publisher/topics.json)
          - GH Actions permissions changed (Settings → Actions → Workflow permissions)
          - Secret rotated (GEMINI_API_KEY, TELEGRAM_*, NETLIFY_AUTH_TOKEN)"
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null || true
