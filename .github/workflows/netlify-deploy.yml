name: Deploy to Netlify on main

# Every push to main builds the site and ships it to goldenmaplelandscaping.ca.
# Triggers automatically on PR merges from the weekly blog publisher (and any
# other main commits). Replaces the manual `netlify deploy --prod` workflow.
#
# Site is pinned by ID — never deploys anywhere else.

on:
  push:
    branches: [main]
    # Don't re-trigger deploys for commits that only touch publisher/watchdog
    # state files — those are bookkeeping, not user-facing changes.
    paths-ignore:
      - 'scripts/blog-publisher/state.json'
      - 'scripts/gbp-publisher/state.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build THROUGH Netlify (`--build`) so the site's environment variables
      # (VITE_GA4_ID, VITE_CLARITY_ID, VITE_META_PIXEL_ID, VITE_GOOGLE_ADS_ID,
      # VITE_SEARCH_CONSOLE_TOKEN, VITE_CRM_BASE_URL …) get injected into the
      # Vite build. A plain `npm run build` on the runner has NO access to those
      # vars, so it shipped an analytics-free bundle and silently stripped
      # GA4 / Clarity / Pixel on every push. `--build` pulls them from the linked
      # Netlify site — single source of truth, the same vars the manual deploy
      # routine already uses. (This replaces the standalone `npm run build` step;
      # netlify runs the build command from netlify.toml itself.)
      - name: Build & deploy to Netlify (production, with site env injected)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 549b17bd-15af-42ee-8f0c-7fef576cf664
        run: |
          npx -y netlify-cli@latest deploy \
            --build \
            --site=549b17bd-15af-42ee-8f0c-7fef576cf664 \
            --prod \
            --message="ci(main): ${GITHUB_SHA::7} — ${GITHUB_ACTOR}"

      # Backstop alert — fires on ANY deploy failure. Without this, a broken main
      # push silently rolls back any auto-deploy expectation. Catches: build
      # failures, missing modules, Netlify auth expiry, dist size limits, etc.
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          MSG="🚨 Netlify deploy FAILED (live site is on previous version)
          Commit: ${{ github.sha }}
          Pushed by: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The live site at goldenmaplelandscaping.ca is unchanged — this push didn't deploy.
          Open the run logs to see the failing step (usually npm run build or netlify-cli auth)."
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null || true
