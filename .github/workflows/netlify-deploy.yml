name: Deploy to Netlify on main

# Every push to main builds the site and ships it to goldenmaplelandscaping.ca.
# Triggers automatically on PR merges from the weekly blog publisher (and any
# other main commits). Replaces the manual `netlify deploy --prod` workflow.
#
# Site is pinned by ID — never deploys anywhere else.

on:
  push:
    branches: [main]
    # Don't re-trigger deploys for commits that only touch publisher/watchdog
    # state files — those are bookkeeping, not user-facing changes.
    paths-ignore:
      - 'scripts/blog-publisher/state.json'
      - 'scripts/gbp-publisher/state.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build THROUGH Netlify (`--build`) so the site's environment variables
      # (VITE_GA4_ID, VITE_CLARITY_ID, VITE_META_PIXEL_ID, VITE_GOOGLE_ADS_ID,
      # VITE_SEARCH_CONSOLE_TOKEN, VITE_CRM_BASE_URL …) get injected into the
      # Vite build. A plain `npm run build` on the runner has NO access to those
      # vars, so it shipped an analytics-free bundle and silently stripped
      # GA4 / Clarity / Pixel on every push. `--build` pulls them from the linked
      # Netlify site — single source of truth, the same vars the manual deploy
      # routine already uses. (This replaces the standalone `npm run build` step;
      # netlify runs the build command from netlify.toml itself.)
      - name: Build & deploy to Netlify (production, with site env injected)
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 549b17bd-15af-42ee-8f0c-7fef576cf664
        run: |
          npx -y netlify-cli@latest deploy \
            --build \
            --site=549b17bd-15af-42ee-8f0c-7fef576cf664 \
            --prod \
            --message="ci(main): ${GITHUB_SHA::7} — ${GITHUB_ACTOR}"

      # Post-deploy analytics guard — fetches the LIVE bundle and verifies every
      # tracker survived the build. Catches the exact class of bug that bit us:
      # a deploy that SUCCEEDS but silently ships an analytics-free bundle (lost
      # Netlify env injection) or the wrong GA4 id. Retries to ride out CDN cache
      # lag so it never false-alarms. On a real miss → Telegram alert + red run.
      #
      # NOTE: these expected IDs are intentional asserts. If you deliberately
      # change an analytics ID in Netlify env, update the four greps below too —
      # otherwise this guard will (correctly) fail to warn you of the change.
      - name: Verify analytics survived the deploy
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          OK=0
          for i in 1 2 3 4 5 6; do
            sleep 10
            HTML=$(curl -fsS https://goldenmaplelandscaping.ca/)
            [ -z "$HTML" ] && continue
            # React Router v7 emits hashed chunks (entry.client-*, root-*, chunk-*, utmCapture-*),
            # NOT a single index-*.js — and the analytics ids may live in any statically-imported
            # chunk. So collect every /assets/*.js the homepage loads and check across all of them.
            ASSETS=$(echo "$HTML" | grep -oE '/assets/[A-Za-z0-9._-]+\.js' | sort -u)
            [ -z "$ASSETS" ] && continue
            GA4=0; CLA=0; PIX=0; ADS=0
            for A in $ASSETS; do
              B=$(curl -fsS "https://goldenmaplelandscaping.ca$A")
              echo "$B" | grep -q "G-1BRTV91W3Z"    && GA4=1
              echo "$B" | grep -q "wisgcj7yvw"       && CLA=1
              echo "$B" | grep -q "2084193635490617" && PIX=1
              echo "$B" | grep -q "AW-10839158941"    && ADS=1
            done
            MISSING=""
            [ "$GA4" = 1 ] || MISSING="$MISSING GA4(G-1BRTV91W3Z)"
            [ "$CLA" = 1 ] || MISSING="$MISSING Clarity(wisgcj7yvw)"
            [ "$PIX" = 1 ] || MISSING="$MISSING MetaPixel"
            [ "$ADS" = 1 ] || MISSING="$MISSING GoogleAds"
            if [ -z "$MISSING" ]; then OK=1; echo "Analytics guard OK — GA4 + Clarity + Pixel + Ads present across $(echo "$ASSETS" | wc -w) bundle(s)"; break; fi
            echo "attempt $i: still missing:$MISSING (checked $(echo "$ASSETS" | wc -w) bundles) — retrying"
          done
          if [ "$OK" != "1" ]; then
            MSG="🚨 Analytics MISSING from live deploy of goldenmaplelandscaping.ca
          Checked: all homepage /assets/*.js chunks
          Missing:${MISSING:- (could not fetch homepage or assets)}
          The deploy SUCCEEDED but the live bundles are missing trackers — most likely the CI build lost Netlify env injection (check the netlify --build step + Netlify env vars), or a tracking id changed. Expected: GA4 G-1BRTV91W3Z, Clarity wisgcj7yvw, Meta Pixel 2084193635490617, Google Ads AW-10839158941.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$MSG" \
              --data-urlencode "disable_web_page_preview=true" > /dev/null || true
            echo "::error::Analytics missing from live bundle:$MISSING"
            exit 1
          fi

      # IndexNow ping — tells Bing / Yandex / Seznam / Naver / etc. about the
      # newly-deployed URLs so they re-crawl + re-index within hours instead of
      # waiting for the next scheduled crawl (which can take days).
      # Free, no auth — IndexNow verifies via the key file at /<KEY>.txt.
      # Google doesn't support IndexNow (they deprecated sitemap /ping in 2023);
      # for Google we rely on the existing sitemap.xml + crawl.
      - name: IndexNow ping (Bing/Yandex)
        if: success()
        run: |
          set +e
          KEY="bdc5de0d5ef8e208d6e1aea168f008d7"
          HOST="goldenmaplelandscaping.ca"

          # Pull every /resources/* URL from the live sitemap as the ping list
          URLS_JSON=$(curl -fsS "https://${HOST}/sitemap.xml" \
            | grep -oE "https://${HOST}/resources/[a-z0-9-]+" \
            | sort -u \
            | head -30 \
            | jq -R . | jq -s .)

          if [ -z "$URLS_JSON" ] || [ "$URLS_JSON" = "[]" ]; then
            echo "[indexnow] no resources URLs found, skipping"
            exit 0
          fi

          BODY=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" \
            --argjson urls "$URLS_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urls}')

          echo "[indexnow] pinging api.indexnow.org with $(echo "$URLS_JSON" | jq length) URLs"
          curl -fsS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -o /dev/null -w "[indexnow] HTTP %{http_code}\n" || echo "[indexnow] ping failed (non-fatal)"

      # Backstop alert — fires only when the deploy STEP itself failed (build
      # error, netlify auth, dist size, etc.). Scoped to steps.deploy so an
      # analytics-guard or IndexNow failure doesn't also fire this misleading
      # "deploy failed" message (the deploy succeeded in that case; the guard
      # sends its own).
      - name: Telegram alert on failure
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          MSG="🚨 Netlify deploy FAILED (live site is on previous version)
          Commit: ${{ github.sha }}
          Pushed by: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The live site at goldenmaplelandscaping.ca is unchanged — this push didn't deploy.
          Open the run logs to see the failing step (usually npm run build or netlify-cli auth)."
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null || true
