name: Test blog-publisher scripts

# Runs node --test on every PR or push that touches the publisher/watchdog
# code. Catches regressions like the 2026-05-30 `merged` vs `mergedAt` bug.
# Built on Node's built-in test runner — no Vitest/Jest needed.

on:
  pull_request:
    paths:
      - 'scripts/blog-publisher/**'
      - '.github/workflows/blog-publisher.yml'
      - '.github/workflows/blog-watchdog.yml'
      - '.github/workflows/netlify-deploy.yml'
      - '.github/workflows/test-blog-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/blog-publisher/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Syntax check all .cjs files
        run: |
          for f in scripts/blog-publisher/*.cjs; do
            node -c "$f" || exit 1
          done

      - name: Run tests
        # Unquoted glob — bash expands to the explicit file list. Node's --test
        # runner takes file paths, not globs.
        run: node --test scripts/blog-publisher/__tests__/*.test.cjs
