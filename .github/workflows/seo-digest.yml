name: Weekly SEO Digest

# Pulls last-7-day Search Console data for goldenmaplelandscaping.ca and
# Telegrams a digest. Inert until GSC_SERVICE_ACCOUNT_JSON repo secret is set.
# See scripts/seo-monitor/README.md for setup.

on:
  schedule:
    - cron: '0 14 * * 6'   # Sat 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: seo-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO digest
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/seo-monitor/gsc-digest.cjs

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          MSG="🚨 SEO Digest workflow FAILED
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null || true
