[build]
  # `npm run lint` runs the pricing-honesty gates (check-pricing-parity,
  # check-engine-snapshot, check-budget-levers) plus typecheck. Before
  # 2026-08-14 this only ran in CI's separate "npm run lint" step in
  # netlify-deploy.yml — but the ACTUAL deploy command Netlify reads is this
  # one, and it was bare `npm run build`. A pricing refactor that silently
  # repriced a job would have shipped unblocked. Do not split these back
  # apart without an equivalent gate elsewhere in the deploy path.
  command = "npm run lint && npm run build"
  # React Router v7 framework build outputs the static client (with prerendered
  # per-route index.html files) to build/client.
  publish = "build/client"

[build.environment]
  # Picks Node only for builds on Netlify's own build image. CI's
  # `netlify deploy --build` runs on the Node that actions/setup-node installs
  # in netlify-deploy.yml, so keep the two versions equal.
  NODE_VERSION = "24"

# Legacy /blog index consolidated into /resources (the working blog index).
# 301 ensures any backlinks or bookmarks land on the canonical page and pass SEO signals through.
# `/blog` alone is not enough: pretty_urls plus a trailing-slash request (`/blog/`)
# miss that rule and fall through to the SPA catch-all, which serves the homepage.
[[redirects]]
  from = "/blog"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/resources/:splat"
  status = 301

# Unprerendered service stub — only the Barrie-suffixed pages exist.
[[redirects]]
  from = "/services/landscape-design"
  to = "/services/landscape-design-barrie"
  status = 301

# SPA fallback — routes NOT prerendered at build time fall back to the generic
# client shell (RR7 emits it as __spa-fallback.html). Prerendered routes are served
# as their own static file first; this only catches the rest (unknown slugs, deep links).
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security + SEO headers on all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify Forms — built-in spam filtering (Akismet) + honeypot is wired in the Contact form
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true
