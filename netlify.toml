[build]
  # `npm run lint` runs the pricing-honesty gates (check-pricing-parity,
  # check-engine-snapshot, check-budget-levers) plus typecheck. Before
  # 2026-08-14 this only ran in CI's separate "npm run lint" step in
  # netlify-deploy.yml — but the ACTUAL deploy command Netlify reads is this
  # one, and it was bare `npm run build`. A pricing refactor that silently
  # repriced a job would have shipped unblocked. Do not split these back
  # apart without an equivalent gate elsewhere in the deploy path.
  command = "npm run lint && npm run build"
  # React Router v7 framework build outputs the static client (with prerendered
  # per-route index.html files) to build/client.
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

# Legacy /blog index consolidated into /resources (the working blog index).
# Both slash forms 301 straight to /resources/. A target without the slash
# would 301 again when pretty_urls adds it. /blog/* stays a separate splat.
[[redirects]]
  from = "/blog"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/resources/:splat"
  status = 301

# Unprerendered service stub — only the Barrie-suffixed pages exist.
[[redirects]]
  from = "/services/landscape-design"
  to = "/services/landscape-design-barrie/"
  status = 301

[[redirects]]
  from = "/services/landscape-design/"
  to = "/services/landscape-design-barrie/"
  status = 301

# Old indexed URLs. Both slash forms: pretty_urls requests the slashed path.
[[redirects]]
  from = "/pages/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/pages/about/"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/pages/process"
  to = "/process/"
  status = 301

[[redirects]]
  from = "/pages/process/"
  to = "/process/"
  status = 301

[[redirects]]
  from = "/resources/project-cost-estimator"
  to = "/cost-estimator/"
  status = 301

[[redirects]]
  from = "/resources/project-cost-estimator/"
  to = "/cost-estimator/"
  status = 301

[[redirects]]
  from = "/quote"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/quote/"
  to = "/contact/"
  status = 301

# /reviews/ is the canonical. Do not redirect that path to itself.
# The rule is not forced: /reviews/index.html is a real file, and forcing this
# match also catches /reviews/ and loops. Both slash forms serve the reviews page.
[[redirects]]
  from = "/reviews"
  to = "/reviews/"
  status = 301

# Unknown paths return the branded 404. A real file (prerendered route) still wins.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security + SEO headers on all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Dictation starts only from the editor's Talk control and browser permission.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Netlify Forms — built-in spam filtering (Akismet) + honeypot is wired in the Contact form
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true
