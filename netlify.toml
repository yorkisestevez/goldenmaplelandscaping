[build]
  command = "npm run build"
  # React Router v7 framework build outputs the static client (with prerendered
  # per-route index.html files) to build/client.
  publish = "build/client"

[build.environment]
  NODE_VERSION = "20"

# Legacy /blog index consolidated into /resources (the working blog index).
# 301 ensures any backlinks or bookmarks land on the canonical page and pass SEO signals through.
[[redirects]]
  from = "/blog"
  to = "/resources"
  status = 301

# SPA fallback — routes NOT prerendered at build time fall back to the generic
# client shell (RR7 emits it as __spa-fallback.html). Prerendered routes are served
# as their own static file first; this only catches the rest (e.g. /portfolio/:slug).
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security + SEO headers on all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify Forms — built-in spam filtering (Akismet) + honeypot is wired in the Contact form
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true
